[project]
name = "hevy-coach"
version = "0.1.0"
description = "Hevy training analytics, strength-standard benchmarking, and an AI coach."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "claude-agent-sdk>=0.2.152",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
hevy-coach = "hevy_coach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hevy_coach"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
